<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Eligibility Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8ff;
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .form-container {
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* result styles */
        .result {
            margin-top: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }
        .result .icon {
            font-size: 1.3rem;
            line-height: 1;
        }
        .result.ok { color: #155724; background: #d4edda; border: 1px solid #c3e6cb; padding: 8px 12px; border-radius: 6px; }
        .result.bad { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; padding: 8px 12px; border-radius: 6px; }

        .view-link {
            display: inline-block;
            margin-left: auto;
            background: #28a745;
            color: #fff;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
        }
        .view-link:hover { opacity: 0.95; }

        @media (max-width: 420px) {
            .result { flex-direction: column; align-items: flex-start; gap:6px; }
            .view-link { margin-left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Check Your Scholarship Eligibility</h1>
    </header>

    <div class="form-container">
        <form id="eligibility-form" novalidate>
            <div class="form-group">
                <label for="school">School Name:</label>
                <input type="text" id="school" name="school" required placeholder="e.g. School of Engineering">
            </div>
            <div class="form-group">
                <label for="gpa">GPA:</label>
                <input type="number" id="gpa" name="gpa" step="0.01" min="0" max="4.0" required placeholder="e.g. 3.45">
            </div>
            <button type="submit">Check Eligibility</button>
        </form>
        <div id="eligibility-result" class="result" role="status" aria-live="polite" style="display:none"></div>
    </div>

    <script>
        const form = document.getElementById('eligibility-form');
        const resultEl = document.getElementById('eligibility-result');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            resultEl.style.display = 'none';
            resultEl.className = 'result'; // reset classes

            const school = document.getElementById('school').value.trim();
            const gpaRaw = document.getElementById('gpa').value;
            const gpa = parseFloat(gpaRaw);

            // basic validation
            if (!school) {
                resultEl.textContent = 'Please enter your school name.';
                resultEl.classList.add('bad');
                resultEl.style.display = '';
                return;
            }
            if (isNaN(gpa) || gpa < 0 || gpa > 4) {
                resultEl.textContent = 'Please enter a valid GPA between 0.00 and 4.00.';
                resultEl.classList.add('bad');
                resultEl.style.display = '';
                return;
            }

            // eligibility threshold: 2.8 or higher => eligible
            if (gpa >= 2.8) {
                resultEl.innerHTML = '<span class="icon" aria-hidden="true">✅</span><span>Eligible</span>';
                // provide link to view scholarships for entered school
                const link = document.createElement('a');
                link.className = 'view-link';
                link.href = `vsch.html?school=${encodeURIComponent(school)}&gpa=${gpa.toFixed(2)}`;
                link.textContent = 'View scholarships';
                resultEl.appendChild(link);

                resultEl.classList.add('ok');
                resultEl.style.display = '';
            } else {
                resultEl.innerHTML = '<span class="icon" aria-hidden="true">✖</span><span>Not eligible</span>';
                resultEl.classList.add('bad');
                resultEl.style.display = '';
            }
        });
    </script>
</body>
</html>
